services:
  gpt2api:
    build: .
    container_name: gpt2api
    ports:
      - "8000:8000"
    volumes:
      - ./session_data.json:/app/session_data.json
    environment:
      # Optional: authenticated mode. Leave empty to run anonymously.
      - CHATGPT_ACCESS_TOKEN=${CHATGPT_ACCESS_TOKEN:-}
      # Optional: protect the admin UI at http://localhost:8000/ (recommended if the port is exposed)
      - ADMIN_KEY=${ADMIN_KEY:-}
    restart: unless-stopped
